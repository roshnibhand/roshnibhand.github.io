  <text x="138" y="302" fill="#A43F2B" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">WEB-GROUNDED</text>
  <text x="138" y="352" fill="#172026" font-family="Georgia, Times New Roman, serif" font-size="40" font-weight="700">Search</text>
  <text x="138" y="400" fill="#63707A" font-family="Inter, Arial, sans-serif" font-size="23">Gemini gathers current public signals across company pages, news, and web results.</text>
  <text x="479" y="302" fill="#A43F2B" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">STRUCTURED</text>
  <text x="479" y="352" fill="#172026" font-family="Georgia, Times New Roman, serif" font-size="40" font-weight="700">Snapshot</text>
  <text x="479" y="400" fill="#63707A" font-family="Inter, Arial, sans-serif" font-size="23">Business model, customers, competition, finances, leadership, culture, and trajectory.</text>
  <text x="820" y="302" fill="#A43F2B" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">OUTPUT</text>
  <text x="820" y="352" fill="#172026" font-family="Georgia, Times New Roman, serif" font-size="40" font-weight="700">PPT deck</text>
  <text x="820" y="400" fill="#63707A" font-family="Inter, Arial, sans-serif" font-size="23">Turns research into a downloadable, editable Company Intelligence Snapshot.</text>
