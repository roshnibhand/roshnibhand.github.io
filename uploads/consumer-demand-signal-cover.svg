<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Consumer Demand Signal">
<defs>
          <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0%" stop-color="#fff8ec"/>
            <stop offset="58%" stop-color="#f5eee0"/>
            <stop offset="100%" stop-color="#edf7f5"/>
          </linearGradient>
          <linearGradient id="navy" x1="0" x2="1" y1="0" y2="1">
